name: Concord Data Systems
description: 'Concord Data Systems was a telecommunications equipment manufacturer founded in 1979 by Ken
  Miller (previously Director of Modem Development at Codex) and based in Marlborough, Massachusetts. The
  company designed and sold high-speed full-duplex dial-up telephone modems for transmitting digital computer
  data in analog form over the public switched telephone network. As the modem hardware market commoditized,
  the business pivoted from industrial data communications to the emerging market for network performance
  management software and was renamed Concord Communications, best known for its eHealth network management
  suite. Battery Ventures was one of thirteen investors in that company. Concord Communications was acquired
  by CA (Computer Associates) on 2005-06-07 for approximately $350 million ($330M cash plus roughly $20M
  of assumed net debt); CA was itself acquired by Broadcom in 2018. Concord Data Systems is therefore a
  historical, defunct entity: it operates no website, no developer portal, and no API surface today. It is
  retained in the API Evangelist network as a venture-portfolio lineage record only.'
